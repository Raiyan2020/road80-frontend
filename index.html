
<!DOCTYPE html>
<html lang="ar" dir="rtl"><!-- lang/dir are overwritten by the init script below -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/road-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>80road</title>
    
    <!-- Theme Initialization Script -->
    <script>
      (function() {
        // Default to Light Mode. Only enable Dark Mode if explicitly saved.
        const theme = localStorage.getItem('road80_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Language Initialization Script — runs before paint to avoid an RTL/LTR flash -->
    <script>
      (function() {
        var lang = 'ar';
        try {
          // zustand/persist writes { state: { lang }, version }
          var raw = localStorage.getItem('road80_lang');
          if (raw) {
            var parsed = JSON.parse(raw);
            var saved = parsed && parsed.state && parsed.state.lang;
            if (saved === 'ar' || saved === 'en') lang = saved;
          }
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: '#3e689b', // Main Brand Color
              blue: '#5b84b8', // Secondary / Accent
              mid: '#82a3cc',
              light: '#a9c2e0',
              pale: '#e1eaf5',
              bg: '#f5f8fa',
            },
            fontFamily: {
              sans: [
                '-apple-system', 
                'BlinkMacSystemFont', 
                '"Segoe UI"', 
                'Roboto', 
                '"Helvetica Neue"', 
                'Arial', 
                'sans-serif'
              ],
            },
            fontSize: {
              // Scaled by 1.3x
              xs: ['0.975rem', { lineHeight: '1.5rem' }],    // was 0.75rem (12px -> ~15.6px)
              sm: ['1.1375rem', { lineHeight: '1.75rem' }],  // was 0.875rem (14px -> ~18.2px)
              base: ['1.3rem', { lineHeight: '2rem' }],      // was 1rem (16px -> ~20.8px)
              lg: ['1.4625rem', { lineHeight: '2rem' }],     // was 1.125rem (18px -> ~23.4px)
              xl: ['1.625rem', { lineHeight: '2.25rem' }],   // was 1.25rem (20px -> ~26px)
              '2xl': ['1.95rem', { lineHeight: '2.5rem' }],  // was 1.5rem (24px -> ~31.2px)
              '3xl': ['2.4375rem', { lineHeight: '3rem' }],  // was 1.875rem (30px -> ~39px)
              '4xl': ['2.925rem', { lineHeight: '1.2' }],     // was 2.25rem (36px -> ~46.8px)
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'fade-out': 'fadeOut 0.5s ease-in-out forwards',
              'fade-in': 'fadeIn 0.5s ease-in-out forwards',
              'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
              'draw': 'draw 0.6s ease-out forwards',
              'scale-in': 'scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'slide-in-right': 'slideInRight 0.25s ease-out forwards',
              'slide-in-left': 'slideInLeft 0.25s ease-out forwards',
            },
            keyframes: {
              fadeOut: {
                '0%': { opacity: '1' },
                '100%': { opacity: '0', visibility: 'hidden' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              draw: {
                'to': { 'stroke-dashoffset': '0' }
              },
              scaleIn: {
                '0%': { transform: 'scale(0.5)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' }
              },
              // Side drawer enters from the leading edge: right in RTL, left in LTR.
              slideInRight: {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(0)' }
              },
              slideInLeft: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --vh: 1vh;
        --header-h: 64px;
        --tab-h: 70px;
        --primary: #3e689b;
      }
      /* Global scrollbar hiding for app-like feel */
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
        background: transparent;
      }

      /* Prevent text selection globally — required for native app store approval */
      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Re-enable selection only inside form inputs */
      input, textarea, [contenteditable="true"] {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }

      /* Prevent image dragging and long-press save for app-like feel */
      img {
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
        user-drag: none;
        -webkit-touch-callout: none;
        pointer-events: none;
      }

      /* Fix iOS Safari extra top space & height */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh; /* Fallback */
        height: calc(var(--vh, 1vh) * 100);
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #f5f8fa;
        transition: background-color 0.3s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      .dark body {
        background-color: #020617;
      }

      body {
        -webkit-tap-highlight-color: transparent;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        -webkit-text-size-adjust: 100%;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }

      /*
       * Styling for admin-authored rich text rendered via dangerouslySetInnerHTML
       * (Filament RichEditor output): safety tips, terms, privacy, about us, blogs.
       *
       * Tailwind's preflight strips margins from <p>, bullets from <ul> and sizing
       * from headings, so without this the HTML collapses into one unbroken block.
       * The class was already referenced in those components but never defined.
       * Inherits colour and font-size from the parent so each page keeps its own.
       */
      .Prose > *:first-child { margin-top: 0; }
      .Prose > *:last-child { margin-bottom: 0; }
      .Prose p,
      .Prose ul,
      .Prose ol,
      .Prose blockquote { margin: 0 0 0.75em; }
      .Prose ul,
      .Prose ol { padding-inline-start: 1.5em; }
      .Prose ul { list-style: disc; }
      .Prose ol { list-style: decimal; }
      .Prose li { margin-bottom: 0.25em; }
      .Prose h1,
      .Prose h2,
      .Prose h3,
      .Prose h4 { font-weight: 700; margin: 1.25em 0 0.5em; line-height: 1.3; }
      .Prose h1 { font-size: 1.5em; }
      .Prose h2 { font-size: 1.25em; }
      .Prose h3 { font-size: 1.1em; }
      .Prose h4 { font-size: 1em; }
      .Prose strong, .Prose b { font-weight: 700; }
      .Prose em, .Prose i { font-style: italic; }
      .Prose a { color: #2563eb; text-decoration: underline; }
      .Prose blockquote {
        padding-inline-start: 1em;
        border-inline-start: 3px solid currentColor;
        opacity: 0.8;
      }
      .Prose img { max-width: 100%; height: auto; border-radius: 0.5rem; }
      .Prose hr { margin: 1em 0; border: 0; border-top: 1px solid currentColor; opacity: 0.2; }
      /* Wide tables shouldn't push the page sideways on a phone. */
      .Prose table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; }
      .Prose th, .Prose td { border: 1px solid currentColor; padding: 0.4em 0.6em; }
    </style>
    <script>
      // Reliable fix for iOS Safari's dynamic viewport height
      const setVh = () => {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      };
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
      setVh();
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>

</head>
  <body class="bg-bg sm:bg-slate-100 dark:sm:bg-slate-950 m-0 p-0 text-navy dark:text-slate-300 font-sans antialiased transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
